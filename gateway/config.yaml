# Per-agent identity: each agent gets its own key, team label and budget.
agents:
  - id: search-assistant
    team: ecommerce
    project: product-search
    key_sha256: 5b1f0c0c3c6e1c8ad0ea9c1d9f1a3a8cf9c3c5f0d4f3b0f3e0a6e2d9b8c7a6f5   # replaced at load time in tests
    monthly_budget_usd: 50
    rpm: 60
    allowed_tiers: [fast, smart]
  - id: store-ops-bot
    team: retail-ops
    project: store-faq
    key_sha256: ""
    monthly_budget_usd: 5
    rpm: 5
    allowed_tiers: [fast]

# Routing: a tier is an ordered list of provider/model; the first healthy one wins, the rest are fallbacks.
tiers:
  smart: [["anthropic", "claude-sonnet-5"], ["openai_compat", "gpt-5-mini"]]
  fast:  [["openai_compat", "gpt-5-mini"], ["anthropic", "claude-haiku-4-5"]]

# USD per 1M tokens (input, output). Illustrative; keep in config, not code.
prices:
  claude-sonnet-5: [3.0, 15.0]
  claude-haiku-4-5: [1.0, 5.0]
  gpt-5-mini: [0.25, 2.0]

budget:
  degrade_at: 0.8     # >=80% of monthly budget: smart requests are served by the fast tier
  block_at: 1.0       # >=100%: reject with 429
